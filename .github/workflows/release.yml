name: release

# Two triggers:
#   * a pushed `v*` tag releases that tag (github.ref_name is the tag), and
#   * a manual run packages an existing tag supplied by the operator, because
#     on workflow_dispatch github.ref_name is a branch, not a tag. The required
#     `tag` input removes that ambiguity. `publish` defaults to false so a
#     manual run is a dry run: everything is built and verified, but no GitHub
#     release is created unless the operator opts in.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0'
        required: true
        type: string
      publish:
        description: 'Actually create the GitHub release (default: dry run)'
        required: false
        default: false
        type: boolean

# Least privilege: only the publish job may write to the repository.
permissions:
  contents: read

jobs:
  # build: read-only token. It builds, tests and packages the project once and
  # hands the resulting bytes to the next jobs. Rust is compiled here and only
  # here; the distro jobs consume the dist tarball from this build. Keeping
  # build and publish apart means a compromised build script (or a malicious
  # dependency) cannot push a release with the write token; only the small
  # publish job holds that power.
  build:
    permissions:
      contents: read
    # Build natively on each architecture. The triple is passed explicitly to
    # `cargo xtask dist` so the tarball name carries the right target, and the
    # matrix travels with the artifact name so no two lanes collide.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Action pins are full commit SHAs, matching ci.yml's convention.
      # checkout / rust-toolchain pins are inherited verbatim from ci.yml
      # (resolved there on 2026-10-28); upload-artifact / download-artifact
      # were resolved via `gh api` on 2026-11-21. Re-resolve deliberately, not
      # by bumping blindly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.99.0 with rustfmt and clippy
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Install QA system tools
        run: |
          sudo apt-get update
          # Filesystem tools for the orchestrated Tier 1 suites: create and
          # check FAT (dosfstools), NTFS (ntfs-3g), ext* (e2fsprogs), UDF
          # (udftools) and exFAT (exfatprogs) images; mtools seeds reads/writes
          # FAT media without a privileged loop mount.
          # Native build headers for Slint/winit (fontconfig.pc,
          # wayland-client.pc and x11/x11-xcb pkg-config modules), needed by
          # `cargo clippy --workspace --all-targets`.
          # dpkg is added here (ci.yml omits it): it provides dpkg-deb, so
          # `cargo xtask dist` really builds the .deb release artifact instead
          # of skipping it on this runner.
          sudo apt-get install -y --no-install-recommends \
            dosfstools ntfs-3g e2fsprogs udftools exfatprogs mtools \
            pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            dpkg
      - name: Install x86-only boot/QEMU tools
        if: matrix.arch == 'x86_64'
        run: |
          # QEMU + OVMF let Tier 2 boot BIOS/UEFI images headlessly.
          # grub-common + grub-pc-bin provide grub-mkimage and the i386-pc
          # boot.img needed to build a bootable GRUB2 BIOS image. These are
          # x86-only packages, not available or relevant on the ARM runner.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf grub-common grub-pc-bin
      # `xtask ci` includes the size-drift gate, whose baseline was recorded on
      # x86_64. Running it on ARM would fail spuriously, so only the x86_64
      # lane runs `ci`; both lanes run `qa`, and `xtask dist` enforces the
      # absolute release budgets on ARM as well.
      - name: Run xtask ci
        if: matrix.arch == 'x86_64'
        run: cargo xtask ci
      - name: Run xtask qa
        run: cargo xtask qa
      - name: Build release artifacts
        run: cargo xtask dist --target ${{ matrix.target }}
      # The published artifacts come only from `cargo xtask dist` under
      # target/dist/<triple>/: a deterministic tar.gz, a .deb and SHA256SUMS.
      # Nothing else in the tree is packaged or uploaded. Each matrix leg gets
      # its own artifact name so the two architectures cannot collide.
      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.arch }}
          path: target/dist/
          if-no-files-found: error

  # package-rpm: read-only token. Container jobs have no source checkout, so we
  # check out the repo (installing git first) purely to obtain the parameterized
  # spec file. No cargo/rustc runs here: rpmbuild only unpacks the pre-built
  # dist tarball into an FHS tree.
  package-rpm:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    steps:
      - name: Install RPM build tools
        run: dnf install -y rpm-build tar gzip git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist
      - name: Build and verify RPM
        run: |
          set -euo pipefail
          # Derive the version from the single dist tarball this lane produced;
          # the Git tag may differ from Cargo's package version. Each artifact
          # contains exactly one tarball, named furus-<version>-<target>.
          mapfile -t tarballs < <(find dist -type f -name '*.tar.gz')
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one dist tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          name="$(basename "${tarballs[0]}" .tar.gz)"
          version="${name#furus-}"
          version="${version%-${{ matrix.target }}}"
          if [ -z "$version" ] || [ "$version" = "$name" ]; then
            echo "cannot derive version from ${tarballs[0]} for target ${{ matrix.target }}" >&2
            exit 1
          fi
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          # rpmbuild resolves Source0 from SOURCES; the exact-name tarball is
          # the only input. Version, target and BuildArch are --define macros.
          find dist -type f -name '*.tar.gz' -exec cp {} ~/rpmbuild/SOURCES/ \;
          rpmbuild -bb \
            --define "furus_version $version" \
            --define "furus_target ${{ matrix.target }}" \
            --define "furus_build_arch ${{ matrix.arch }}" \
            packaging/rpm/furus.spec
          rpm_file="$(find ~/rpmbuild/RPMS -type f -name '*.rpm' -print -quit)"
          [ -n "$rpm_file" ] && [ -s "$rpm_file" ] || { echo 'no RPM produced' >&2; exit 1; }
          listing="$(rpm -qlp "$rpm_file")"
          for path in \
            /usr/bin/furus \
            /usr/bin/furus-gui \
            /usr/libexec/furus-helper \
            /usr/share/polkit-1/actions/org.furuslinux.policy \
            /usr/share/dbus-1/system-services/org.furuslinux.Helper1.service \
            /usr/share/dbus-1/system.d/org.furuslinux.Helper1.conf \
            /usr/share/applications/org.furuslinux.Furus.desktop \
            /usr/share/metainfo/org.furuslinux.Furus.metainfo.xml \
            /usr/share/icons/hicolor/scalable/apps/org.furuslinux.Furus.svg \
            /usr/share/licenses/furus/LICENSES.md
          do
            printf '%s\n' "$listing" | grep -Fxq -- "$path" || { echo "RPM missing $path" >&2; exit 1; }
          done
          echo "RPM requires:"; rpm -qpR "$rpm_file"
          echo "RPM recommends:"; rpm -qp --recommends "$rpm_file"
          mkdir -p out
          cp "$rpm_file" out/
      - name: Upload RPM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-${{ matrix.arch }}
          path: out/*.rpm
          if-no-files-found: error

  # package-arch: read-only token. As above, we check out the repo only for the
  # parameterized PKGBUILD; makepkg runs as a non-root builder and consumes the
  # pre-built tarball, with no Rust recompilation.
  package-arch:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            arch_image: archlinux:latest
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch_image: lfdevs/archlinux-ports:base-devel@sha256:a24c8b0151cdfcd678027eebba1d315f3c0d5433747c314b95e634a4492e280b
    runs-on: ${{ matrix.runner }}
    # Official `archlinux:latest` publishes an amd64 image only, so the ARM
    # lane uses the maintained AArch64 port image instead. It is pinned by
    # index digest so the mutable `base-devel` tag cannot change this build;
    # x86_64 keeps the exact original `archlinux:latest` string.
    container: ${{ matrix.arch_image }}
    steps:
      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel zstd tar git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist
      - name: Build and verify Arch package
        run: |
          set -euo pipefail
          # Derive the version from the single dist tarball this lane produced;
          # the Git tag may differ from Cargo's package version. Each artifact
          # contains exactly one tarball, named furus-<version>-<target>.
          mapfile -t tarballs < <(find dist -type f -name '*.tar.gz')
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one dist tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          name="$(basename "${tarballs[0]}" .tar.gz)"
          version="${name#furus-}"
          version="${version%-${{ matrix.target }}}"
          if [ -z "$version" ] || [ "$version" = "$name" ]; then
            echo "cannot derive version from ${tarballs[0]} for target ${{ matrix.target }}" >&2
            exit 1
          fi
          # makepkg refuses to run as root: build in a dir owned by `builder`.
          id builder >/dev/null 2>&1 || useradd -m builder
          mkdir -p /work
          cp packaging/arch/PKGBUILD /work/
          find dist -type f -name '*.tar.gz' -exec cp {} /work/ \;
          chown -R builder:builder /work
          # furus_version (not pkgver: makepkg unsets pkgver) and _target are
          # the environment overrides the recipe reads. `arch=('x86_64'
          # 'aarch64')` in PKGBUILD lets makepkg pick the runner's native arch.
          su builder -c "cd /work && furus_version='$version' _target='${{ matrix.target }}' makepkg -f --noconfirm --skipchecksums"
          pkg_file="$(find /work -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          [ -n "$pkg_file" ] && [ -s "$pkg_file" ] || { echo 'no Arch package produced' >&2; exit 1; }
          listing="$(tar --zstd -tf "$pkg_file" | sed 's#^\./##')"
          for path in \
            usr/bin/furus \
            usr/bin/furus-gui \
            usr/libexec/furus-helper \
            usr/share/polkit-1/actions/org.furuslinux.policy \
            usr/share/dbus-1/system-services/org.furuslinux.Helper1.service \
            usr/share/dbus-1/system.d/org.furuslinux.Helper1.conf \
            usr/share/applications/org.furuslinux.Furus.desktop \
            usr/share/metainfo/org.furuslinux.Furus.metainfo.xml \
            usr/share/icons/hicolor/scalable/apps/org.furuslinux.Furus.svg \
            usr/share/licenses/furus/LICENSES.md
          do
            printf '%s\n' "$listing" | grep -Fxq -- "$path" || { echo "Arch package missing $path" >&2; exit 1; }
          done
          mkdir -p out
          cp "$pkg_file" out/
      - name: Upload Arch package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-${{ matrix.arch }}
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  # publish: the ONLY job with contents:write. It downloads every artifact into
  # one directory, rebuilds one SHA256SUMS covering all four artifact kinds so
  # the verification and the upload agree, and publishes with the built-in
  # github.token. gh (preinstalled on ubuntu-latest) avoids a third-party
  # release action and any extra secret. `--repo` is explicit: gh has no Git
  # repository to infer from here (there is no checkout in this job).
  publish:
    needs: [build, package-rpm, package-arch]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release
      - name: Flatten artifacts into release/
        run: |
          set -euo pipefail
          cd release
          # Each `dist-<arch>` artifact was uploaded with `path: target/dist/`,
          # so its tarball, .deb and SHA256SUMS arrive under a <target>/
          # subdirectory — one per architecture (x86_64 and aarch64). The rpm
          # and arch artifacts are already flat in release/. Move every file
          # up to the root so the globs below see all 8 files, and drop every
          # nested SHA256SUMS; the unified one is regenerated in the next step.
          find . -mindepth 2 -type f -name SHA256SUMS -delete
          find . -mindepth 2 -type f -exec mv -t . -- {} +
      - name: Regenerate unified SHA256SUMS and verify
        run: |
          set -euo pipefail
          cd release
          # Drop any stray per-arch dist SHA256SUMS and replace it with one
          # covering every file that will be attached to the release. Bare
          # filenames keep `sha256sum -c` resolvable in this directory; a
          # mismatch fails the step and therefore the whole job.
          rm -f SHA256SUMS
          sha256sum *.tar.gz *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            ./*.tar.gz ./*.deb ./*.rpm ./*.pkg.tar.zst ./SHA256SUMS
