name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Action pins below were resolved on 2026-10-28 (comments name the
      # moving ref each SHA was taken from); re-resolve deliberately, not
      # by bumping blindly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.99.0 with rustfmt and clippy
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Run xtask ci
        run: cargo xtask ci
