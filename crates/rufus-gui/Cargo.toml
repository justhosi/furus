[package]
name = "rufus-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "rufus_gui"
path = "src/lib.rs"

[[bin]]
name = "rufus-gui"
path = "src/main.rs"

[dependencies]
rufus-core = { path = "../rufus-core" }
rufus-linux = { path = "../rufus-linux" }
rufus-proto = { path = "../rufus-proto" }
# A7: Slint is the mandated GUI toolkit (S24-T1). Pinned to a single
# exact version with default-features off; the feature set is the
# minimal one for a winit backend with the software renderer only —
# no GPU (femtovg), no webview, no GTK, no Qt.
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
# A9: `rustix::process::geteuid` feeds the pure `startup_refusal(euid)`
# check (GUI-never-root). std cannot report the effective uid without
# `unsafe`, which this crate forbids; `rustix` is the contract-sanctioned
# escape hatch (contract 0.4.1). Pinned exactly like Slint.
# The version matches the rustix already in the workspace lock file.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process"] }

[build-dependencies]
# A7: same exact version as `slint` above.
slint-build = "=1.19.0"

[lints]
# Inherit the workspace-wide `unsafe_code = "deny"`; the crate-level
# `#![forbid(unsafe_code)]` is the stricter statement of the same
# policy in source.
workspace = true
