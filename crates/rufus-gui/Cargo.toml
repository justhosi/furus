[package]
name = "rufus-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "rufus_gui"
path = "src/lib.rs"

[[bin]]
name = "rufus-gui"
path = "src/main.rs"

[dependencies]
rufus-core = { path = "../rufus-core" }
rufus-linux = { path = "../rufus-linux" }
rufus-proto = { path = "../rufus-proto" }

[lints]
# Inherit the workspace-wide `unsafe_code = "deny"`; the crate-level
# `#![forbid(unsafe_code)]` is the stricter statement of the same
# policy in source.
workspace = true
