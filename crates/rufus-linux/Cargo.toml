[package]
name = "rufus-linux"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# S04 (PLAN §4): safe syscalls for the watcher (inotify, poll) — no libc,
# no unsafe, no subprocesses.
# S07 adds `libc` on top, but only `src/ioctl.rs` (the module doc there
# is the policy: exactly four block ioctls rustix does not wrap) may sit
# under its umbrella; everything else stays on rustix.
rustix = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
rufus-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
# Inherit the workspace-wide `unsafe_code = "deny"`; the single
# `#[allow(unsafe_code)]` of the workspace lives in src/ioctl.rs.
workspace = true
