[package]
name = "rufus-helper"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# S06: the helper is a consumer, not an owner — core (hash/units/text/
# error), proto (plan + event stream), linux (sysfs/inspect) and rustix
# for the geteuid root check. No clap (three flags are hand-parsed), no
# libc.
# S06 part 5a adds zbus/async-io (workspace entries above): compile-time
# only here — src/dbus.rs is the pure service layer; 5b wires the bus.
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rufus-core = { workspace = true }
rufus-proto = { workspace = true }
rufus-linux = { workspace = true }
zbus = { workspace = true }
async-io = { workspace = true }

[dev-dependencies]
# S06: scratch directories for the session/validate fixtures.
tempfile = { workspace = true }

[[bin]]
name = "rufus-helper"
path = "src/main.rs"

[lints]
# Enforce the workspace-wide `unsafe_code = "forbid"` (S04 review).
workspace = true
