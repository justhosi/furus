[package]
name = "rufus-helper"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# S06: the helper is a consumer, not an owner — core (hash/units/text/
# error), proto (plan + event stream), linux (sysfs/inspect) and rustix
# for the geteuid root check. No clap (three flags are hand-parsed), no
# libc.
# S06 part 5b: src/dbus.rs uses zbus directly now — the polkit-backed
# authorizer and the signal emitter both talk to `zbus::Connection`
# (async-only since zbus 6: sync call sites drive it with
# `zbus::block_on` on plain threads, never on the runtime). No direct
# runtime crate: nothing here names one, and zbus pulls the runtime
# it needs itself.
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rufus-core = { workspace = true }
rufus-proto = { workspace = true }
rufus-linux = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
# S06: scratch directories for the session/validate fixtures.
tempfile = { workspace = true }

[[bin]]
name = "rufus-helper"
path = "src/main.rs"

[lints]
# Inherit the workspace-wide `unsafe_code = "deny"`; the crate-level
# `#![forbid(unsafe_code)]` is the stricter statement of the same
# policy in source.
workspace = true
