<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- This policy restricts who may OWN the well-known name
       org.rufuslinux.Helper1: only the root-run service may claim it.
       It is defence in depth against a second process impersonating the
       helper on the system bus. -->
  <policy user="root">
    <allow own="org.rufuslinux.Helper1"/>
  </policy>

  <!-- Unprivileged clients may still SEND to the well-known name: the GUI
       runs as the user and calls Execute/Cancel. This file is NOT the
       authorization gate for methods; the helper checks the polkit action
       org.rufuslinux.write-device for the caller before it reads a plan.
       A group-restricted send policy would duplicate (and could drift from)
       that polkit decision, so it is deliberately not used here. -->
  <policy context="default">
    <deny own="org.rufuslinux.Helper1"/>
    <allow send_destination="org.rufuslinux.Helper1"/>
  </policy>
</busconfig>
