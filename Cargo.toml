[workspace]
resolver = "3"
members = [
    "crates/rufus-core",
    "crates/rufus-linux",
    "crates/rufus-proto",
    "crates/rufus-helper",
    "crates/rufus-cli",
    "crates/rufus-gui",
    "crates/wimlib-sys",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Unpublished: the public name/licence (A1, A2) are still proposed.
publish = false

[workspace.dependencies]
# S02 core-runtime dependencies (kept minimal: no async, no logging
# framework, no chrono/time, no regex — see PLAN.md section 5).
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8" }
thiserror = { version = "2" }
# Dev-only: scratch directories for unit tests.
tempfile = { version = "3" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
