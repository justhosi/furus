[workspace]
resolver = "3"
members = [
    "crates/rufus-core",
    "crates/rufus-linux",
    "crates/rufus-proto",
    "crates/rufus-helper",
    "crates/rufus-cli",
    "crates/rufus-gui",
    "crates/wimlib-sys",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Unpublished: the public name/licence (A1, A2) are still proposed.
publish = false

# S04 review: unsafe-code enforcement lives in the workspace so every
# member inherits it through `[lints] workspace = true`, instead of
# trusting each crate to remember its own attribute.
# S07: "deny" now instead of "forbid" — exactly one module needs unsafe,
# the kernel ioctl shim in rufus-linux (four block ioctls rustix does
# not wrap), and it carries the one `#[allow(unsafe_code)]` of the
# workspace. Every other crate still carries an explicit
# `#![forbid(unsafe_code)]` at its root, so the shim remains the single
# place in the tree that compiles unsafe code at all.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# S02 core-runtime dependencies (kept minimal: no async, no logging
# framework, no chrono/time, no regex — see PLAN.md section 5).
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8" }
thiserror = { version = "2" }
# Dev-only: scratch directories for unit tests.
tempfile = { version = "3" }
# S03 plan-JSON / CLI / checksum dependencies (PLAN.md §4: clap (derive)
# for the command surface, serde_json for the versioned plan contract,
# RustCrypto digests for hashing — no other new crates are allowed by §5).
# The S04 review cut clap to its feature budget (PLAN §5): colour and
# wrap-help are dropped on purpose (the captured CLI output must stay
# ANSI-free), while suggestions/usage/error-context keep the
# "did you mean" behaviour the tests rely on.
serde_json = { version = "1" }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
sha2 = { version = "0.10" }
sha1 = { version = "0.10" }
md-5 = { version = "0.10" }
# S04 (PLAN §4 lists rustix for rufus-linux): safe syscalls for inotify and
# poll so the device watcher needs no libc and no unsafe code.
# S06 adds two features for the privileged helper: `process` (geteuid for
# the root check) and `thread` (the S06 part 4 instrumentation the worker
# needs — unshare(2)/thread setup for the per-session mount namespace).
# S06 part 4 adds `mount` on top: the per-run isolation
# (unshare(CLONE_NEWNS) + recursive-private /) and the mount/unmount seam
# behind it (`mount(2)`/`umount2(2)` with the MNT_DETACH fallback).
rustix = { version = "1", features = ["fs", "event", "std", "process", "thread", "mount"] }
# S07 (PLAN §4): only the kernel ioctl shim in rufus-linux uses `libc` —
# the four block ioctls (BLKZEROOUT/BLKDISCARD/BLKRRPART/BLKFLSBUF) that
# rustix does not wrap; see crates/rufus-linux/src/ioctl.rs.
libc = "0.2"
# S06 part 5b: the privileged D-Bus service. zbus 5's default features
# ("async-io" + "blocking-api") are what the helper's src/dbus.rs uses
# (`zbus::blocking::Connection`, whose proxy layer runs on zbus's own
# async-io worker runtime); no version below 5 has "blocking-api".
# No direct `async-io` dependency exists anywhere in the workspace now:
# no crate names the crate, and zbus brings the runtime transitively.
zbus = { version = "5" }
# Internal crates (path form, so workspaces can share them exactly).
rufus-core = { path = "crates/rufus-core" }
rufus-proto = { path = "crates/rufus-proto" }
rufus-linux = { path = "crates/rufus-linux" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
